# =============================================================================
# EveryUp Agent watches your Docker services and syncs their health, logs,
# API access-log summaries, events, and host metrics to EveryUp Web.
# Notifications are configured in Web.
#
# Run without cloning the repo (only Docker required):
#   mkdir everyup-agent && cd everyup-agent
#   curl -O https://raw.githubusercontent.com/ai-turn/everyup/main/agent/docker-compose.yml
#   # edit this compose file: set EVERYUP_WEB_BASE_URL and EVERYUP_AGENT_API_KEY
#   docker compose up -d
# =============================================================================

services:
  everyup-agent:
    image: aiturn/everyup-agent:latest
    # Build from source instead of the pre-built image:
    # build:
    #   context: .
    #   dockerfile: Dockerfile
    container_name: everyup-agent
    environment:
      EVERYUP_WEB_SYNC_ENABLED: "true"
      EVERYUP_WEB_BASE_URL: "http://your-everyup-web:3001"
      EVERYUP_AGENT_API_KEY: "evup_svc_replace_me"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro  # Docker auto-discovery/logs
      - /:/hostfs:ro                                   # host CPU/memory/disk metrics
      - everyup-agent-data:/data
    restart: unless-stopped

volumes:
  everyup-agent-data:
    driver: local