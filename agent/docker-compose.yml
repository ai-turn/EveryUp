# =============================================================================
# EveryUp Agent watches your Docker services and syncs their health, logs,
# API access-log summaries, events, and host metrics to EveryUp Web.
# Notifications are configured in Web.
#
# The Web UI now provides the preferred one-line, one-time-code installer.
# For a manual installation (Docker Compose 2.23.1+ required):
#   mkdir everyup-agent && cd everyup-agent
#   curl -O https://raw.githubusercontent.com/ai-turn/everyup/main/agent/docker-compose.yml
#   # edit this compose file: set EVERYUP_WEB_BASE_URL and EVERYUP_AGENT_API_KEY
#   docker compose up -d
# =============================================================================

services:
  everyup-agent:
    image: aiturn/everyup-agent:latest
    # Build from source instead of the pre-built image:
    # build:
    #   context: .
    #   dockerfile: Dockerfile
    container_name: everyup-agent
    networks:
      everyup-monitoring: {}
    environment:
      EVERYUP_WEB_SYNC_ENABLED: "true"
      EVERYUP_WEB_BASE_URL: "http://your-everyup-web:3001"
      EVERYUP_AGENT_API_KEY: "evup_svc_replace_me"
      # Keep this aligned with OBI's OTEL_EBPF_BPF_CONTEXT_PROPAGATION when
      # enabling the advanced, kernel-dependent distributed trace option.
      EVERYUP_EBPF_CONTEXT_PROPAGATION_ENABLED: "false"
      # TZ: "Asia/Seoul"  # agent log timestamps in your local time (default: UTC)
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro  # Docker auto-discovery/logs
      - /:/hostfs:ro                                   # host CPU/memory/disk metrics
      - everyup-agent-data:/data
      # Optional: header capture via app OTel injection — uncomment this line
      # AND the everyup-instrumentation volume at the bottom. The agent fills
      # the volume with the OTel Java agent jar + Node bundle; your app compose
      # mounts it read-only (see "App Instrumentation" in the README).
      # - everyup-instrumentation:/everyup-instrumentation
    restart: unless-stopped

  # --- Automatic zero-code API tracing (OpenTelemetry eBPF Instrumentation) ---
  # Discovers processes in Docker/OCI containers automatically. No app port
  # list, app image change, or app restart is required. The regular Agent stays
  # unprivileged; only this isolated observer receives the eBPF permissions.
  # Requires Linux kernel 5.8+ with BTF. On an unsupported host this service may
  # stop, while container health, logs, events, and host metrics keep working.
  everyup-ebpf:
    image: otel/ebpf-instrument:v0.7.1
    container_name: everyup-ebpf
    restart: "on-failure:5"
    privileged: true   # load eBPF probes; kept separate from everyup-agent
    pid: "host"        # observe application processes in the host PID namespace
    networks:
      everyup-monitoring: {}
    depends_on:
      everyup-agent:
        condition: service_started
    configs:
      - source: everyup-obi-config
        target: /etc/obi/config.yml
        mode: 0444
    environment:
      OTEL_EBPF_CONFIG_PATH: "/etc/obi/config.yml"
      # Traces only: EveryUp derives RED stats from spans, so exporting OBI
      # metrics as well would count the same requests twice.
      OTEL_EXPORTER_OTLP_TRACES_ENDPOINT: "http://everyup-agent:4318/v1/traces"
      OTEL_EXPORTER_OTLP_TRACES_PROTOCOL: "http/protobuf"
      # Marks these resources for strict PID-to-Docker-service attribution.
      OTEL_RESOURCE_ATTRIBUTES: "everyup.source=ebpf"

volumes:
  everyup-agent-data:
    driver: local
  # Uncomment together with the agent volume line above. The fixed name lets
  # your app compose reference it as an external volume.
  # everyup-instrumentation:
  #   name: everyup-instrumentation

networks:
  everyup-monitoring:
    name: everyup-monitoring

# Kept inline so installation still needs only this one Compose file. OBI does
# not receive the Docker socket: this preserves its host:PID instance identity,
# which the Agent resolves against Docker without trusting executable names.
configs:
  everyup-obi-config:
    content: |
      discovery:
        instrument:
          - exe_path: "*"
            containers_only: true
        exclude_instrument:
          - exe_path: "*everyup-agent*"
        exclude_otel_instrumented_services: true
