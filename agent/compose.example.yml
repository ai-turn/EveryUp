services:
  everyup-agent:
    build: .
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /:/hostfs:ro
      - everyup-agent-data:/data
      # optional: uncomment if using the otel-collector profile below
      # - everyup-generated-config:/etc/everyup/generated
      - ./everyup-conf.d:/etc/everyup/conf.d:ro

  # optional: zero-code API tracing via eBPF — uncomment and set BEYLA_OPEN_PORT
  # to your app ports. Requires Linux kernel 5.8+ with BTF.
  # everyup-ebpf:
  #   image: grafana/beyla:3
  #   restart: unless-stopped
  #   privileged: true
  #   pid: "host"
  #   environment:
  #     BEYLA_OPEN_PORT: "80,3000,8080"
  #     OTEL_EXPORTER_OTLP_TRACES_ENDPOINT: "http://everyup-agent:4318/v1/traces"
  #     OTEL_EXPORTER_OTLP_PROTOCOL: "http/protobuf"
  #     OTEL_RESOURCE_ATTRIBUTES: "everyup.source=ebpf"

  # optional: add EVERYUP_OTEL_CONFIG_ENABLED=true to .env and uncomment this block
  # otel-collector:
  #   image: otel/opentelemetry-collector-contrib:0.110.0
  #   restart: unless-stopped
  #   command: ["--config=/etc/everyup/generated/otel-config.yaml"]
  #   volumes:
  #     - /var/run/docker.sock:/var/run/docker.sock:ro
  #     - /:/hostfs:ro
  #     - everyup-generated-config:/etc/everyup/generated:ro
  #     - ./everyup-conf.d:/etc/everyup/conf.d:ro
  #   ports:
  #     - "4317:4317"
  #     - "4318:4318"

volumes:
  everyup-agent-data:
  # everyup-generated-config:
